# Directories will be set in a locals file, not the config
# note: we don't have a way to save the bkgsub image yet so it has to be recreated if you do find or aperture_photometry

# steps = ["subtract_bkg", "source_find", "aperture_photometry", "apcorr", "residual", "psffit"]
steps = ["subtract_bkg", "aperture_photometry", "apcorr", "residual", "psffit"] 
targets = ["ngc3351"]
product = ""
# NGC5068 has no PaA, and 657->658
# bands = ["convolved_pah_f360m","F657","F187N","F200W","F300M","F335M","F360M","F770W","F1000W"]
bands = ["convolved_pah_f360m","F187N","F200W","F300M","F335M","F360M","F770W","F1000W"]
# bands = ["F657","F187N","F1000W"]
version = ''
ptype = [""]
projects = [""]
inst = ["NIRCam"]
cat_filetype = "ecsv"

doregion = false
# NGC5068 [199.729, -21.040]. # .01
region_center =  [160.9902, 11.7022]
region_size = 0.002

[parameters.r_opt]

max_r = 20
brightest_ropt = 50
frac = 0.95
plot = true

[parameters.bkg_subtract]

sigma = 3.0
coverage_mask = false
# background parameters can be specified in _pix or in _pc;  if both are present, _pix takes precedence
# box_size_pc = 100
# filter_size_pc = 15
box_size_pix = 100
filter_size_pix = 10
bkg_estimator = 'SExtractorBackground()'
sigma_to_clip_bkg = 3.0
maxiters_for_bkg_clip = 5 
plot = false

[parameters.source_find]

finder = 'peaks'
snr_threshold = 10.0
fwhm = 2.0
roundlo = -0.5
roundhi = 0.5
sharplo = 0.2
sharphi = 1.0
nsources = 100000
# find_cat_filename = '' # override default of f"{gal}_jwst_{band}_find_cat." + cat_filetype
# use the pah photometered catalog here to get the same brightest 36 sources - also have to re-force the conv_pah itself in "bands"
find_cat_filename = 'Phot_v5p4_src_335_ngc3351.csv'

[parameters.apcorr]

# for method=crds, you input an eefraction, and it calculates the radius to use for photometry
# for method=cluster, the corrections determined for the specific Rodriguez aperture radii are used
# for method=psf, you set the radius in photometry with fwhm2rad, radius_sky_in, radius_sky_out, and then 
#     it calculates the ap corr from the psf for you.

eefraction_value = 0.80
apcorr_method = 'psf'

[parameters.photometry]

use_brightest = 2000  # 0=False or a number
# RH had 2.5x which is very large. 1 is a little tight maybe. 1.5 seems ok for now
fwhm2rad = 1.5
use_filter_fwhm = false 
# can be scaler, or array with same number of elements as "bands"
# bands = ["convolved_pah_f360m","F657","F187N","F200W","F300M","F335M","F360M","F770W","F1000W"]
# aperture_radius_arcsec = [0.124, 0.15848, 0.124,0.124,0.124,0.124,0.124, 0.168, 0.209]
aperture_radius_arcsec = [0.124, 0.124,0.124,0.124,0.124,0.124, 0.168, 0.209]
# radius_sky can either be a number in pixels, or a string like "2r" to indicate 2*aperture radius
radius_sky_in  = "2r"
radius_sky_out = "3r"
sigma_to_clip_bkg = 3.0
maxiters_for_bkg_clip = 5
write = true
overwrite = true
local_bkg_subtract = true
# phot_cat_filename = '' # option to override default f"{gal}_jwst_{band}_cat." + cat_filetype
phot_cat_extrastring = "from_hst"   # add this to the filenames

[parameters.psffit]

fittype="ampwid"